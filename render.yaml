databases:
  - name: seats-db
    plan: free
    region: singapore
    databaseName: seats
    user: seats
    postgresMajorVersion: "16"

services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    # Render uses this one check both to route and to restart. Restarts must key off liveness (is the process
    # alive?), not readiness: a DB blip, or a CPU-starved readiness probe mid-burst, must not get a healthy process
    # killed. Readiness (/actuator/health/readiness) still checks the DB and fails closed for anything routing on it.
    healthCheckPath: /actuator/health/liveness
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seats-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        sync: false
      - key: DB_POOL_SIZE
        value: "20"
      - key: ADMISSION_MAX_CONCURRENT
        value: "24"
      - key: ADMISSION_MAX_WAIT_MS
        value: "30000"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=32m -Xss256k -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
